# knowledge-hub path configuration
#
# This file only defines the `@kb/`-relative regulation path constants below,
# looked up via {{key}}. It intentionally has NO `kb:` root path key.
#
# The real, host-specific KB root ($KB_ROOT) lives in the gitignored
# memory/reference_knowledge_base.local.md (auto-generated by
# setup-host.ps1/.sh). This file is git-tracked, so it must never contain a
# host's real absolute path - consumers resolve $KB_ROOT from memory first,
# then use it to replace the `@kb/` prefix in the paths below.
#
# Project knowledge base (knowledge/{project}/) paths are resolved dynamically
# by skills at runtime, and are not centrally configured in this file.

# ============================================================
# Subfolder paths
# ============================================================

paths:
  roles:     "@kb/roles"
  flows:     "@kb/role-flows"
  skills:    "@kb/skills"
  knowledge: "@kb/knowledge"
  guideline: "@kb/knowledge/common_KBs/guideline"
  adrs:      "@kb/knowledge/common_KBs/ADRs"
  setting:   "@kb/setting"

# ============================================================
# Frequently used documents (quick reference)
# ============================================================

regulations:

  # Role definitions
  role_backend:    "@kb/roles/role-backend.md"
  role_qa:         "@kb/roles/role-qa.md"
  role_sre:        "@kb/roles/role-sre.md"
  role_pm:         "@kb/roles/role-pm.md"
  role_sa:         "@kb/roles/role-sa.md"
  role_consultant: "@kb/roles/role-consultant.md"
  role_reviewer:   "@kb/roles/role-reviewer.md"

  # Workflows
  flow_backend:    "@kb/role-flows/flow-backend.md"
  flow_qa:         "@kb/role-flows/flow-qa.md"
  flow_sre:        "@kb/role-flows/flow-sre.md"
  flow_pm:         "@kb/role-flows/flow-pm.md"
  flow_sa:         "@kb/role-flows/flow-sa.md"
  clarification_protocol: "@kb/role-flows/clarification-protocol.md"
  flow_consultant: "@kb/role-flows/flow-consultant.md"
  flow_reviewer:   "@kb/role-flows/flow-reviewer.md"

  # Shared knowledge (cross-project, auto-loaded)
  review_guide:   "@kb/knowledge/common_KBs/guideline/REVIEW_GUIDE.md"
  adrs:           "@kb/knowledge/common_KBs/ADRs"
  tech-research:  "@kb/knowledge/common_KBs/tech-research"



